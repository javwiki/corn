name: Deploy mdBook site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set weekly cache key
        run: echo "CARGO_CACHE_WEEK=$(date -u +%G-%V)" >> "$GITHUB_ENV"
      - name: Cache Cargo downloads and installed tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: cargo-tools-${{ runner.os }}-${{ env.CARGO_CACHE_WEEK }}
          restore-keys: |
            cargo-tools-${{ runner.os }}-
      - name: Install mdBook, mdbook-summarizer and mdbook-tagging
        run: |
          rustup update stable
          for tool in mdbook mdbook-summarizer mdbook-tagging; do
            if command -v "$tool" &>/dev/null; then
              echo "$tool $( $tool --version ) cached, skipping install"
            else
              cargo install --locked "$tool"
            fi
          done

      - name: Generate tag index pages with mdbook-tagging
        run: |
          mdbook-tagging generate .
          echo "Tag pages generated"

      - name: Generate SUMMARY.md with mdbook-summarizer
        run: |
          mdbook-summarizer --src src --auto-readme
          echo "SUMMARY.md generated"

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with mdBook
        run: mdbook build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
