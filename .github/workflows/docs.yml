# Based on https://zensical.org/docs/publish-your-site/#with-github-actions,
# but builds with the locked uv environment and the full validation script so
# CI publishes exactly what ./scripts/build_site.sh accepts locally.
name: Documentation
on:
  push:
    branches:
      - main
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: 0.12.24
          python-version: "3.12"
      - run: ./scripts/build_site.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
