[project]
site_name = "成人影片演员百科"
site_url = "https://javwiki.github.io/corn/zh/"
site_description = "成人影片演员相关资料索引。"
site_author = "language learner"
repo_url = "https://github.com/javwiki/corn"
repo_name = "javwiki/corn"
edit_uri = "edit/main/docs/zh/"
docs_dir = "docs/zh"
site_dir = "site/zh"
use_directory_urls = true

[project.extra]
alternate = [
  { name = "English", link = "/corn/", lang = "en" },
  { name = "中文", link = "/corn/zh/", lang = "zh" },
]

[project.theme]
variant = "classic"
language = "zh"
font = false
custom_dir = "overrides"
# 首字母目录使用 navigation.indexes：字母 index.md 作为该字母的目录节点，
# 演员条目作为其子级缩进显示（不再与目录页平级）。
features = [
  "navigation.instant",
  "navigation.path",
  "navigation.indexes",
  "navigation.top",
  "search.highlight",
]

# Follow the user's system color preference by default.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "切换到浅色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "切换到深色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "跟随系统设置"

[project.plugins.tags]
