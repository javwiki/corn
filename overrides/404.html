{% extends "main.html" %}
{% block content %}
  <h1>页面未找到 / Page not found</h1>
  <p>你访问的页面不存在、已移动或已删除。</p>
  <p>The page you requested does not exist, may have moved, or may have been removed.</p>
  <ul>
    {% for alt in config.extra.alternate %}
      <li><a href="{{ alt.link }}">{{ alt.name }} home</a></li>
    {% endfor %}
  </ul>
{% endblock %}
