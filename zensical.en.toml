[project]
site_name = "Adult Film Performer Encyclopedia"
site_url = "https://javwiki.github.io/corn/en/"
site_description = "A reference index of adult film performers."
site_author = "language learner"
repo_url = "https://github.com/javwiki/corn"
repo_name = "javwiki/corn"
edit_uri = "edit/main/docs/en/"
docs_dir = "docs/en"
site_dir = "site/en"
use_directory_urls = true

[project.extra]
alternate = [
  { name = "中文", link = "/corn/", lang = "zh" },
  { name = "English", link = "/corn/en/", lang = "en" },
]

[project.theme]
variant = "classic"
language = "en"
features = [
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Follow system preference"

[project.plugins.tags]
