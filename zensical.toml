[project]
site_name = "Adult Film Performer Encyclopedia"
site_url = "https://javwiki.github.io/corn/"
site_description = "A machine-translated draft index of adult film performers; facts remain under review."
site_author = "language learner"
repo_url = "https://github.com/javwiki/corn"
repo_name = "javwiki/corn"
edit_uri = "edit/main/docs/en/"
docs_dir = "docs/en"
site_dir = "site"
use_directory_urls = true

[project.extra]
alternate = [
  { name = "English", link = "/corn/", lang = "en" },
  { name = "中文", link = "/corn/zh/", lang = "zh" },
]

[project.theme]
variant = "classic"
language = "en"
font = false
custom_dir = "overrides"
features = [
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Follow system preference"

[project.plugins.tags]

[project.plugins.redirects.redirect_maps]
"L/Elle_Lee.md" = "E/Elle_Lee.md"
# English used to be published under /corn/en/ before it became the site root.
# These redirects keep the previously published English URLs working.
