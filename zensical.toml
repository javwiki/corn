[project]
site_name = "成人影片演员百科"
site_url = "https://javwiki.github.io/corn/"
site_description = "成人影片演员相关资料索引。"
site_author = "language learner"
repo_url = "https://github.com/javwiki/corn"
repo_name = "javwiki/corn"
edit_uri = "edit/main/docs/zh/"
docs_dir = "docs/zh"
site_dir = "site"
use_directory_urls = true

[project.extra]
alternate = [
  { name = "中文", link = "/corn/", lang = "zh" },
  { name = "English", link = "/corn/en/", lang = "en" },
]

[project.theme]
variant = "classic"
language = "zh"
font = false
custom_dir = "overrides"
features = [
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

# Follow the user's system color preference by default.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "切换到浅色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "切换到深色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "跟随系统设置"

[project.plugins.tags]

[project.plugins.redirects.redirect_maps]
"L/Elle_Lee.md" = "E/Elle_Lee.md"
